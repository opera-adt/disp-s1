name: disp-s1-env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.9, <3.13
  - pip>=21.3  # https://pip.pypa.io/en/stable/reference/build-system/pyproject-toml/#editable-installation
  - git  # for pip install, due to setuptools_scm
  - click>=7.0
  - cmap
  - gdal>=3.8  # For Footprint
  - libgdal-netcdf
  - libgdal-hdf5
  - h5netcdf>=1.0
  - matplotlib-base
  - pydantic>=2.1
  - ruamel.yaml>=0.15
  - yamale
  # Corrections
  - pysolid  # For solid earth tide corrections
  # - pyaps3
  - xarray
  # Unwrappers:
  - snaphu>=0.4.1
  - isce3-cpu>=0.16.0 # For baseline
  - tophu
  # - cxx-compiler # for whirlwind
  - rich  # opera_utils.missing_data imports this but doesn't declare it as a dep
  - opera-utils>=0.25.9  # dolphin>=0.42.7 needs is_remote_url (added in 0.25.7)
  - pip:
    # spurt isn't on conda-forge; only installable via pip (from GitHub in the
    # Dockerfile, since there's no PyPI release either).
    - spurt>=0.1.0
    # conda-forge only has dolphin 0.42.8; use the GitHub tag until it catches up.
    - git+https://github.com/isce-framework/dolphin@v0.42.9
